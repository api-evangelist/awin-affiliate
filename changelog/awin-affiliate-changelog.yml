versioning_note: >-
  The API is unversioned (see lifecycle/awin-affiliate-lifecycle.yml), so
  entries carry a month rather than a version number.
machine_readable: true
machine_readable_note: >-
  Every release-notes page is retrievable as markdown by appending .md to its
  help.awin.com URL - a real agent-readable change surface even though it is not
  API-scoped.
