description: >-
  Awin publishes a dated, monthly Product Releases stream mirrored into the help
  centre as Release notes. It is a PLATFORM changelog, not an API changelog -
  entries describe UI, reporting and commission-management changes, and none of
  the four most recent months announces an API addition, removal or breaking
  change. There is no /apidocs/changelog page (404) and no per-endpoint version
  history, so an API consumer has no dated record of contract changes.
scheme: dated-monthly
