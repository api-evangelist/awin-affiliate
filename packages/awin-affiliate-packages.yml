source: >-
  npm registry search, PyPI, RubyGems, and the github.com/awin organisation
  listing, cross-checked against help.awin.com/apidocs
description: >-
  Awin publishes NO first-party API client library in any public package
  registry. npm, PyPI and RubyGems were all searched for awin / awin-api /
  awin-sdk / affiliate-window and every hit is community-maintained. What Awin
  DOES publish as first-party code is a set of tracking artefacts on
  github.com/awin - Google Tag Manager templates for the MasterTag, Conversion
  Tag, consent signals and last-click identifier, plus a GTIN validator - none
  of which wrap the REST API at api.awin.com. The documented integration path
  for non-developers is Zapier rather than an SDK. Consumers of the REST API
  are expected to call it directly with an HTTP client.
official_sdk_count: 0
notes: >-
  Because no official client library exists, no `SDKs` pointer is wired in
  apis.yml. Recording the absence is the finding: an affiliate network of
  Awin's size shipping zero maintained client libraries is a real developer
  experience gap, and the third-party packages below are the only libraries a
  developer can reach for - the newest of them was last published 2026-02-04
  and the rest are five to eight years stale.
