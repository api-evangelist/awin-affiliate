description: >-
  Awin serves an RFC 9116 security.txt from three separate hosts - the marketing
  site (www.awin.com), the API host (api.awin.com) and the platform UI
  (ui.awin.com). The www and ui documents point at Awin's Intigriti-run private
  bug bounty; the api.awin.com document instead advertises an OpenBugBounty
  listing. No OIDC / OAuth discovery documents, no api-catalog and no ai-plugin
  manifest are served on any host - Awin's API tokens are minted in the platform
  UI rather than through a discoverable authorization server, which is why
  /.well-known/openid-configuration and /.well-known/oauth-authorization-server
  both 404.
