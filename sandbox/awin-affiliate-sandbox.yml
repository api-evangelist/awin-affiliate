gaps:
- No sandbox host or test-mode credential of any kind.
- Write surfaces (Conversion API, batch validation, Create Offers) can only be exercised against production.
- >-
  The Conversion API documents a 3-minute ingestion delay and a tracking-method
  prioritisation window, so even a deliberate production test has a slow,
  non-deterministic feedback loop.
- No published test card / test identifier / simulator values, because Awin does not process payments.
