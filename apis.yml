aid: awin-affiliate
url: https://raw.githubusercontent.com/api-evangelist/awin-affiliate/refs/heads/main/apis.yml
name: Awin
kind: company
description: Awin is a global affiliate marketing network connecting advertisers
  (brands) with publishers (content creators, cashback, voucher, and loyalty
  partners) across thousands of programmes worldwide. Awin exposes a documented
  public REST API at https://api.awin.com that lets both publishers and advertisers
  pull data such as individual transactions and aggregated performance reports,
  inspect commission groups and programme details, list the accounts a user can
  access, and generate tracking links and offers. All endpoints follow REST
  principles, return JSON, are served over HTTPS only, and authenticate with an
  OAuth 2.0 Bearer access token issued at the user level from the Awin UI (the
  Create Transactions API is the exception and uses an x-api-key). A platform-wide
  throttle limits requests to 20 API calls per minute per user.
