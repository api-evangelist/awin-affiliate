apis:
- aid: awin-affiliate:awin-affiliate-accounts-api
  name: Awin Accounts API
  tags:
  - Accounts
  - Users
  - Permissions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.awin.com/apidocs/returns-information-about-accounts-for-a-given-user
  baseURL: https://api.awin.com
  properties:
  - url: https://help.awin.com/apidocs/introduction-1
    type: Documentation
  - url: https://help.awin.com/apidocs/returns-information-about-accounts-for-a-given-user
    type: APIReference
  - url: openapi/awin-affiliate-openapi.yml
    type: OpenAPI
  - url: collections/awin-affiliate.postman_collection.json
    type: PostmanCollection
  - url: collections/awin-affiliate.opencollection.json
    type: OpenCollection
  description: Return the list of Awin accounts the authenticated user can access.
    Because the access token is set at the user level, GET /accounts enumerates
    every publisher and advertiser account associated with the user, with an
    optional type filter, so integrations can discover account IDs before making
    per-account requests.
- aid: awin-affiliate:awin-affiliate-transactions-api
  name: Awin Transactions API
  tags:
  - Transactions
  - Sales
  - Commissions
  - Reporting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.awin.com/apidocs/returns-a-list-of-transactions-for-a-given-publisher
  baseURL: https://api.awin.com
  properties:
  - url: https://help.awin.com/apidocs/returns-a-list-of-transactions-for-a-given-publisher
    type: Documentation
  - url: https://help.awin.com/apidocs/returns-a-list-of-transactions-for-a-given-advertiser
    type: APIReference
  - url: openapi/awin-affiliate-openapi.yml
    type: OpenAPI
  - url: collections/awin-affiliate.postman_collection.json
    type: PostmanCollection
  - url: collections/awin-affiliate.opencollection.json
    type: OpenCollection
  description: Pull individual transactions (sales, leads, bonuses) for a publisher
    or advertiser over a date range of up to 31 days, filtered by timezone, date
    type (transaction, validation, amendment), and status (pending, approved,
    declined, deleted). Responses include click and order references, custom
    parameters, commission, conversion lapse time, and optional basket products.
- aid: awin-affiliate:awin-affiliate-reports-api
  name: Awin Reports API
  tags:
  - Reports
  - Performance
  - Aggregation
  - Analytics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.awin.com/apidocs/get-advertiser-performance-report
  baseURL: https://api.awin.com
  properties:
  - url: https://help.awin.com/apidocs/get-advertiser-performance-report
    type: Documentation
  - url: https://help.awin.com/apidocs/get-publisher-performance-report
    type: APIReference
  - url: openapi/awin-affiliate-openapi.yml
    type: OpenAPI
  - url: collections/awin-affiliate.postman_collection.json
    type: PostmanCollection
  - url: collections/awin-affiliate.opencollection.json
    type: OpenCollection
  description: Retrieve aggregated performance reports over a date range. Publishers
    aggregate by advertiser, creative, or campaign; advertisers aggregate by
    publisher, creative, or campaign. Each report breaks impressions, clicks, and
    transaction counts, values, and commission down by status (pending, confirmed,
    bonus, declined) with totals, region, and currency.
- aid: awin-affiliate:awin-affiliate-commission-groups-api
  name: Awin Commission Groups API
  tags:
  - Commission Groups
  - Commissions
  - Rates
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.awin.com/apidocs/gets-an-array-of-commission-groups-for-an-advertiser
  baseURL: https://api.awin.com
  properties:
  - url: https://help.awin.com/apidocs/gets-an-array-of-commission-groups-for-an-advertiser
    type: Documentation
  - url: openapi/awin-affiliate-openapi.yml
    type: OpenAPI
  - url: collections/awin-affiliate.postman_collection.json
    type: PostmanCollection
  - url: collections/awin-affiliate.opencollection.json
    type: OpenCollection
  description: Request all commission groups of a programme along with the commission
    values a publisher earns. Returns each group's id, name, code, type (fix or
    percentage), amount or percentage, currency, effective rate window, and any
    applicable conditions, with an optional effectiveDate for historical rates.
- aid: awin-affiliate:awin-affiliate-programmes-api
  name: Awin Programmes API
  tags:
  - Programmes
  - Advertisers
  - Relationships
  - KPIs
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.awin.com/apidocs/get-program-information-details-for-publisher
  baseURL: https://api.awin.com
  properties:
  - url: https://help.awin.com/apidocs/get-program-information-for-publisher-by-relationship-and-optionally-filter-by-country
    type: Documentation
  - url: https://help.awin.com/apidocs/get-program-information-details-for-publisher
    type: APIReference
  - url: openapi/awin-affiliate-openapi.yml
    type: OpenAPI
  - url: collections/awin-affiliate.postman_collection.json
    type: PostmanCollection
  - url: collections/awin-affiliate.opencollection.json
    type: OpenCollection
  description: Discover the advertiser programmes a publisher works with and their
    details. List programmes filtered by relationship (joined, pending, suspended,
    rejected, notjoined, any) and optionally by country, then pull per-programme
    detail including description, membership status, valid domains, KPIs (EPC,
    conversion rate, approval percentage, average payment time, Awin index) and the
    commission range across commission groups.
