  source: https://www.awin.com/gb/legal/information-security
- id: soc-2
  conforms: false
  evidence: Not claimed on the Information Security or Compliance pages.
- id: pci-dss
  conforms: false
  evidence: Not claimed. Awin is not a card acquirer.
