  docs: https://help.awin.com/apidocs/introduction-1
  note: >-
    Base URL is https://api.awin.com with no version path. The /v1-api/ prefix
    appears only in documentation-site URLs, not in callable endpoints. An
    unversioned public API with no deprecation policy means any breaking change
    reaches every consumer at once.
