method: searched
source: https://help.awin.com/apidocs/introduction-1
description: >-
  Awin runs an unversioned API. Every documented endpoint sits directly under
  https://api.awin.com with no version segment, no version header and no
  documented version negotiation - the docs site organises pages under a
  /v1-api/ path prefix but the callable base URL carries no version. There is no
  published deprecation policy, no Sunset/Deprecation header support (RFC 8594)
  and no SLA document. Awin DOES run a real Atlassian Statuspage at
  status.awin.com with per-component status (Click, and other tracking and
  platform components) and a monthly product-release stream that acts as the
  change record.
versioning:
